basePath: /
definitions:
  api.ErrorResponse:
    properties:
      error:
        type: string
      status:
        type: integer
      success:
        type: boolean
    type: object
  api.HLTVInfoResponse:
    properties:
      connect:
        type: string
      demos_count:
        type: integer
      game_id:
        type: string
      id:
        type: integer
      name:
        type: string
      port:
        type: string
      running:
        type: boolean
      show_ip:
        type: string
    type: object
  api.HLTVListItem:
    properties:
      connect:
        type: string
      demos_count:
        type: integer
      game_id:
        type: string
      id:
        type: integer
      name:
        type: string
      port:
        type: string
      running:
        type: boolean
      show_ip:
        type: string
    type: object
  api.HLTVListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/api.HLTVListItem'
        type: array
    type: object
  api.MessageResponse:
    properties:
      message:
        type: string
    type: object
host: 0.0.0.0:3030
info:
  contact: {}
  description: API for HLTV-Manager.
  title: HLTV-Manager backend
  version: beta1.0
paths:
  /api/v1/hltv:
    get:
      consumes:
      - application/json
      description: Returns all configured HLTV instances with current runtime status
        and demo count.
      produces:
      - application/json
      responses:
        "200":
          description: List of HLTV instances
          schema:
            $ref: '#/definitions/api.HLTVListResponse'
        "405":
          description: Method not allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get list of HLTV instances
      tags:
      - hltv
  /api/v1/hltv/{id}:
    get:
      consumes:
      - application/json
      description: Returns one HLTV instance by ID with current runtime status and
        demos count.
      parameters:
      - description: HLTV ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: HLTV instance summary
          schema:
            $ref: '#/definitions/api.HLTVInfoResponse'
        "400":
          description: Invalid HLTV ID
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: HLTV not found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get HLTV instance details
      tags:
      - hltv
  /api/v1/hltv/{id}/restart:
    post:
      consumes:
      - application/json
      description: Restarts one HLTV instance by ID.
      parameters:
      - description: HLTV ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: HLTV restarted
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Restart error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method not allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Restart HLTV instance
      tags:
      - hltv
  /api/v1/hltv/{id}/start:
    post:
      consumes:
      - application/json
      description: Starts one HLTV instance by ID.
      parameters:
      - description: HLTV ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: HLTV started
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Start error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method not allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Start HLTV instance
      tags:
      - hltv
  /api/v1/hltv/{id}/stop:
    post:
      consumes:
      - application/json
      description: Stops one HLTV instance by ID.
      parameters:
      - description: HLTV ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: HLTV stopped
          schema:
            $ref: '#/definitions/api.MessageResponse'
        "400":
          description: Stop error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method not allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Stop HLTV instance
      tags:
      - hltv
schemes:
- http
swagger: "2.0"
